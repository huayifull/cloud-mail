name: Provision store mailboxes
on:
  workflow_dispatch:
    inputs:
      mailboxes_json:
        description: 'Array of email and display name objects (max 100)'
        required: true
        type: string
      apply:
        description: 'Create missing inboxes after validation'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: provision-store-mailboxes
  cancel-in-progress: false
jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate and provision D1 inboxes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN: ${{ secrets.ADMIN }}
          MAILBOXES_JSON: ${{ inputs.mailboxes_json }}
          APPLY: ${{ inputs.apply }}
        run: python3 scripts/provision-store-mailboxes.py
      - uses: actions/upload-artifact@v4
        with:
          name: mailbox-provision-result
          path: mailbox-provision-result.json
          retention-days: 7
